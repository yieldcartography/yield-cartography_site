<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macrocartography · Macro radars for the United States and Poland</title>
<meta name="description" content="Macro Radar for the United States and Poland: five headline gauges, a regime compass and about 250 public indicators, refreshed every weekday. English and Polish.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="macrocartography: macro radars for the United States and Poland">
<meta property="og:description" content="Five headline gauges, a regime compass and about 250 public indicators, refreshed every weekday.">
<meta property="og:image" content="https://macrocartography.com/assets/og.png">
<style>
/*__SITE_CSS__*/
  * { box-sizing:border-box; }
  :root { --z-green:rgba(120,190,140,0.55); --z-pale:rgba(170,215,175,0.5); --z-amber:rgba(240,185,95,0.55); --z-red:rgba(220,110,120,0.6); --z-blue:rgba(110,160,220,0.5); --z-grey:rgba(160,170,185,0.35); }
  html { font-size:15px; }
  body { margin:0; background:var(--yc-bg); color:var(--yc-ink); font-family:var(--yc-sans); line-height:1.55; }
  a { color:var(--yc-accent); text-decoration:none; }
  main { max-width:1180px; margin:0 auto; padding:32px; }
  .hero { padding:44px 0 34px 0; border-bottom:1px solid var(--yc-rule); margin-bottom:34px; }
  .hero h1 { font-size:38px; line-height:1.15; margin:0 0 16px 0; letter-spacing:-0.5px; color:var(--yc-ink); }
  .hero p { font-size:17px; color:var(--yc-ink-soft); margin:0; max-width:820px; }
  .nf { display:none; background:var(--yc-panel); border:1px solid var(--yc-rule); border-left:4px solid var(--yc-salmon); border-radius:4px; padding:10px 14px; margin:0 0 6px; font-family:var(--yc-mono); font-size:12.5px; }
  body.notfound .nf { display:block; }
  .sec-h { padding-bottom:8px; border-bottom:1px solid var(--yc-rule); font-family:var(--yc-mono); font-size:14px; text-transform:uppercase; letter-spacing:1.4px; color:var(--yc-accent); margin:0 0 16px 0; }
  .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin:0 0 40px; }
  .card { background:var(--yc-panel); border:1px solid var(--yc-rule); border-radius:4px; padding:20px 22px 18px; display:flex; flex-direction:column; gap:12px; color:inherit; transition:border-color 0.2s, transform 0.2s; }
  .card:hover { border-color:var(--yc-accent); transform:translateY(-2px); }
  .card-h { display:flex; align-items:center; gap:10px; }
  .card-h svg { box-shadow:0 0 0 1px rgba(0,0,0,0.18); border-radius:2px; }
  .card-h h2 { margin:0; font-size:20px; font-weight:650; color:var(--yc-ink); letter-spacing:-0.2px; }
  .card-h .asof { margin-left:auto; color:var(--yc-muted); font-family:var(--yc-mono); font-size:11px; }
  .rows { display:flex; flex-direction:column; gap:2px; }
  .row { display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:7px 0; border-bottom:1px dotted var(--yc-rule); }
  .row:last-child { border-bottom:none; }
  .row .n { font-size:14px; color:var(--yc-ink-soft); }
  .row .v { font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; color:var(--yc-ink); }
  .chip { font-family:var(--yc-mono); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; border-radius:3px; padding:2px 8px; min-width:92px; text-align:center; color:var(--yc-ink); }
  .fisc { color:var(--yc-muted); font-size:12.5px; }
  .go { margin-top:auto; color:var(--yc-accent); font-family:var(--yc-mono); font-size:12px; text-transform:uppercase; letter-spacing:0.6px; }
  .about { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }
  .about div { background:var(--yc-panel); border:1px solid var(--yc-rule); border-radius:4px; padding:16px 18px; }
  .about h3 { margin:0 0 6px; font-family:var(--yc-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--yc-accent); font-weight:700; }
  .about p { margin:0; font-size:13.5px; color:var(--yc-ink-soft); }
  @media (max-width:760px){ .cards, .about { grid-template-columns:1fr; } .hero h1 { font-size:28px; } main { padding:20px; } }
</style>
</head>
<body class="landing">
<header class="mc-sh no-country" id="mcHeader"></header>
<main>
  <div class="hero"><div class="nf" id="nf"></div><h1 id="h1"></h1><p id="lead"></p></div>
  <h2 class="sec-h" id="cardsH"></h2>
  <div class="cards" id="cards"></div>
  <h2 class="sec-h" id="aboutH"></h2>
  <div class="about" id="about"></div>
</main>
<footer class="mc-sf" id="mcFooter"></footer>
<script>
/*__SITE_JS__*/
</script>
<script>
"use strict";
const SUMMARY = /*__SUMMARY__*/null;
const LANGS=["en","pl"];
function detectLang(){ let q=null; try{ q=new URLSearchParams(location.search).get("lang"); }catch(e){}
  if(q&&LANGS.includes(q)){ try{ localStorage.setItem("mc_lang",q); }catch(e){} return q; }
  try{ const s=localStorage.getItem("mc_lang"); if(LANGS.includes(s)) return s; }catch(e){}
  return String(navigator.language||"").toLowerCase().startsWith("pl")?"pl":"en"; }
let LANG=detectLang();
const T=(en,pl)=>LANG==="pl"?pl:en;
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const MON={en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],pl:["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"]};
const mon=d=>d?MON[LANG][+d.slice(5,7)-1]+" "+d.slice(0,4):"–";
const FLAG={us:`<svg viewBox="0 0 19 12" width="24" height="16" aria-hidden="true"><rect width="19" height="12" fill="#b22234"/>${[1,3,5,7,9,11].map(i=>`<rect y="${(i*12/13).toFixed(2)}" width="19" height="${(12/13).toFixed(2)}" fill="#fff"/>`).join("")}<rect width="7.6" height="${(7*12/13).toFixed(2)}" fill="#3c3b6e"/>${[[1.3,1.2],[3.8,1.2],[6.3,1.2],[2.5,2.6],[5,2.6],[1.3,4],[3.8,4],[6.3,4],[2.5,5.4],[5,5.4]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="0.42" fill="#fff"/>`).join("")}</svg>`,
  pl:`<svg viewBox="0 0 16 10" width="24" height="16" aria-hidden="true"><rect width="16" height="5" fill="#fff"/><rect y="5" width="16" height="5" fill="#dc143c"/></svg>`};
const NAME={us:{en:"United States",pl:"Stany Zjednoczone"},pl:{en:"Poland",pl:"Polska"}};
const ROWS=[["economy","Economy","Gospodarka"],["prices","Price pressure","Presja cenowa"],["policy","Policy stance","Nastawienie polityki"],["conditions","Financial conditions","Warunki finansowe"],["recession","Recession risk","Ryzyko recesji"]];
const url=(c)=>"/"+c+"/?lang="+LANG;
// the menu opens the radar last visited, or the one that matches the language
function navCountry(){ try{ const c=localStorage.getItem("mc_country"); if(c==="us"||c==="pl") return c; }catch(e){} return LANG==="pl"?"pl":"us"; }
function render(S){
  document.documentElement.lang=LANG;
  document.title=T("macrocartography · Macro radars for the United States and Poland","macrocartography · Makroradary dla Stanów Zjednoczonych i Polski");
  const nc=navCountry();
  const hd=document.getElementById("mcHeader");
  hd.innerHTML=MCSHELL.header({lang:LANG, country:null, view:null, home:"/?lang="+LANG, flagHref:c=>url(c), navHref:v=>url(nc)+"#"+v});
  document.getElementById("mcFooter").innerHTML=MCSHELL.footer({lang:LANG, radarHref:c=>url(c), aboutHref:url(nc)+"#about"});
  document.getElementById("nf").innerHTML=T("That page does not exist. The two radars are below.","Ta strona nie istnieje. Oba radary są poniżej.");
  document.getElementById("cardsH").textContent=T("The two radars","Dwa radary");
  document.getElementById("aboutH").textContent=T("How it works","Jak to działa");
  document.getElementById("h1").textContent=T("Macro radars for the United States and Poland","Makroradary dla Stanów Zjednoczonych i Polski");
  document.getElementById("lead").textContent=T("Public statistics turned into five headline gauges, a regime compass and about 250 indicators you can open one by one, refreshed every weekday. Choose a country with the flags and a language with EN / PL: either radar reads in either language.",
    "Publiczne statystyki zamienione w pięć wskaźników głównych, kompas reżimów i około 250 wskaźników, które można otwierać pojedynczo, odświeżane w każdy dzień roboczy. Kraj wybierasz flagami, a język przyciskami EN / PL: każdy radar można czytać w każdym z dwóch języków.");
  document.getElementById("cards").innerHTML=["us","pl"].map(c=>{ const s=S&&S[c], H=s&&s.headline||{};
    const rows=ROWS.filter(([k])=>H[k]).map(([k,en,pl])=>{ const h=H[k], z=h.zone||{}; return `<div class="row"><span class="n">${esc(T(en,pl))}</span><span class="v">${(+h.v).toFixed(1)}${k==="recession"?" %":""}</span><span class="chip" style="background:var(--z-${z.c||"grey"})">${esc(z[LANG]||"")}</span></div>`; }).join("");
    const f=H.fiscal?`<div class="fisc">${T("Fiscal impulse","Impuls fiskalny")} ${(H.fiscal.v>0?"+":"")+(+H.fiscal.v).toFixed(2)} ${T("pp of GDP","pkt proc. PKB")}, ${mon(H.fiscal.d)} · ${T("part of the policy stance","część nastawienia polityki")}</div>`:"";
    return `<a class="card" href="${url(c)}"><div class="card-h">${FLAG[c]}<h2>${esc(NAME[c][LANG])}</h2><span class="asof">${s?T("data as of ","dane na ")+esc(s.data_as_of)+" · "+s.n_series+T(" series"," szeregów"):""}</span></div>`
      +`<div class="rows">${rows||`<div class="fisc">${T("No summary yet.","Brak podsumowania.")}</div>`}</div>${f}<span class="go">${T("Open the radar","Otwórz radar")} &rarr;</span></a>`; }).join("");
  document.getElementById("about").innerHTML=[
    [T("What it shows","Co pokazuje"),T("Each gauge averages robust z-scores of its indicators: shown from 0 to 100, where 50 is a typical reading, with coloured zones that name it. Click any gauge on a radar to see the indicators behind it and their contributions.","Każdy wskaźnik uśrednia odporne wyniki z swoich składników, pokazane w skali od 0 do 100, gdzie 50 to odczyt typowy, z kolorowymi strefami, które go nazywają. Kliknij dowolny wskaźnik na radarze, aby zobaczyć jego składniki i ich wkład.")],
    [T("Where the data come from","Skąd są dane"),T("United States: FRED (Federal Reserve Bank of St. Louis). Poland: Eurostat, GUS, NBP, the Ministry of Finance, BIS, ECB, OECD, GPW and YieldCartography's Polish curve. Every series links to its source.","Stany Zjednoczone: FRED (Federal Reserve Bank of St. Louis). Polska: Eurostat, GUS, NBP, Ministerstwo Finansów, BIS, EBC, OECD, GPW i polska krzywa YieldCartography. Każdy szereg prowadzi do swojego źródła.")],
    [T("How to use it","Jak korzystać"),T("Open a gauge to see its groups and indicators, search any series in the finder, follow long series over the regime canvas in history, and download every figure and table.","Otwórz wskaźnik, aby zobaczyć jego grupy i składniki, dowolny szereg znajdziesz w wyszukiwarce, długie szeregi na tle reżimów prześledzisz w historii, a każdy wykres i tabelę możesz pobrać.")]
  ].map(([h,p])=>`<div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");
  hd.onclick=e=>{ const b=e.target.closest("button[data-lang]"); if(!b||b.dataset.lang===LANG) return; LANG=b.dataset.lang; try{ localStorage.setItem("mc_lang",LANG); }catch(e){}
    try{ const u=new URL(location.href); u.searchParams.set("lang",LANG); history.replaceState(null,"",u.toString()); }catch(e){} render(CUR); };
}
let CUR=SUMMARY;
render(CUR);
fetch("/data/summary.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.us&&j.pl&&(!CUR||String(j.built)>=String(CUR.built))){ CUR=j; render(CUR); } }).catch(()=>{});
</script>
</body>
</html>
